# Cloud-Konfiguration für Huntery Stage (docs/CLOUD-SETUP.md 1.5). Nur die Eigenschaften, die hier stehen, werden
# übertragen; alles andere bleibt, wie es im Projekt ist. Werte wie in supabase/config.toml, aber mit Stage-Adressen.
# Kein SMTP-Abschnitt: Host, Port, Absender und Passwort trägt der Inhaber im Dashboard ein (Passwort nie im Repo).
#   supabase/cloud/config.sh stage diff    (Vorschau)
#   supabase/cloud/config.sh stage push    (übertragen)
project_id = "cauwmmxoghnwgadmkgfz"

[api]
enabled = true
# Kein GraphQL (ADR 005).
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "https://stage.huntery.de"
additional_redirect_urls = [
  "https://stage.huntery.de/*/auth/confirm**",
  "https://stage.huntery.de/*/auth/callback**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 10

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "5s"
otp_length = 6
otp_expiry = 600

# Pfade im temporären Arbeitsordner von config.sh, der supabase/templates hineinkopiert (dieselben Vorlagen wie
# lokal; die CLI lässt keine Pfade außerhalb des Arbeitsordners zu, auch keine Links).
[auth.email.template.confirmation]
subject = "Huntery: Anmeldecode / Sign-in code / Přihlašovací kód / Kod logowania"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Huntery: Anmeldecode / Sign-in code / Přihlašovací kód / Kod logowania"
content_path = "./supabase/templates/magic_link.html"

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/private/custom_access_token_hook"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.apple]
enabled = false
