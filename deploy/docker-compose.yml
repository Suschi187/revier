# Betrieb auf einem EU-Server (M10, Entscheidung 2026-11-15). Aufruf im Ordner deploy/:
#   cp .env.example .env   # Werte eintragen, nie committen
#   docker compose up -d --build
# Je Umgebung (Stage, Prod) ein eigener Server bzw. eine eigene .env.
services:
  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
        NEXT_PUBLIC_AUTH_APPLE_ENABLED: ${NEXT_PUBLIC_AUTH_APPLE_ENABLED:-false}
    image: huntery-web:${RELEASE:-local}
    restart: unless-stopped
    environment:
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      MAP_TILES_FILE: ${MAP_TILES_FILE:-}
    expose:
      - "3000"
    # Logs nur lokal und begrenzt (keine IPs: Next protokolliert keine Zugriffe).
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TILES_DIR:-./tiles}:/srv/tiles:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
