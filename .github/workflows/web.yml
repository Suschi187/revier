# Siehe docs/adr/004-ci.md: Lint, Typecheck, Tests und Build der Web-App. Ohne Secrets, ohne Deploy.
name: web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keine Server-Secrets mit NEXT_PUBLIC_-Präfix
        run: |
          if grep -rEn "NEXT_PUBLIC_[A-Z0-9_]*(SERVICE|SECRET)" \
              --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git .; then
            echo "::error::Server-Secrets dürfen nie mit NEXT_PUBLIC_ beginnen (docs/adr/002)."
            exit 1
          fi
      - name: Keine Supabase-Secret-Keys oder privaten Schlüssel im Repo
        run: |
          if grep -rEln "sb_secret_[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----" \
              --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git .; then
            echo "::error::Secret im Repo gefunden. Entfernen und den Key rotieren (docs/adr/002)."
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Öffentliche Platzhalter, damit der Build die Env-Validierung besteht. Keine echten Werte.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/**/*.ts', 'web/**/*.tsx', 'web/**/*.json', 'web/**/*.css') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Kernflows im Browser gegen ein lokales Supabase mit Mailpit (docs/adr/010, CLAUDE.md: Playwright).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0
      - name: Supabase starten (mit Auth und Mailpit)
        working-directory: .
        run: supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Öffentlichen lokalen Key übernehmen (nur der publishable Key)
        working-directory: .
        run: |
          key=$(supabase status -o env | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')
          test -n "$key"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"
      - run: npm ci
      # API-Tests gegen die lokale Supabase (ADR 009, QA M2). CI=true: Abbruch, falls Supabase fehlt.
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
