# Siehe docs/adr/009-rls-tests-supabase-ci.md: Migrationen, pgTAP-Tests und Lint gegen ein lokales Supabase.
name: supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", "web/lib/supabase/database.types.ts", ".github/workflows/supabase.yml"]
  pull_request:
    paths: ["supabase/**", "web/lib/supabase/database.types.ts", ".github/workflows/supabase.yml"]

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0
      # Auth und Storage legen eigene Schemas an, die Migrationen und Tests brauchen; der Rest bleibt aus.
      - run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset
      - run: supabase test db
      - name: "TypeScript-Typen sind aktuell (sonst: cd web && npm run gen:types)"
        run: |
          supabase gen types typescript --local --schema public > web/lib/supabase/database.types.ts
          git diff --exit-code web/lib/supabase/database.types.ts
      - run: supabase db lint -s public,private --level warning --fail-on warning
