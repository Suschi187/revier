# Siehe docs/adr/009-rls-tests-supabase-ci.md: Migrationen, pgTAP-Tests und Lint gegen ein lokales Supabase.
name: supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", "web/lib/supabase/database.types.ts", ".github/workflows/supabase.yml"]
  pull_request:
    paths: ["supabase/**", "web/lib/supabase/database.types.ts", ".github/workflows/supabase.yml"]

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 3.0.0
      # Auth und Storage legen eigene Schemas an, die Migrationen und Tests brauchen; der Rest bleibt aus.
      - run: supabase start -x imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset
      - run: supabase test db
      - name: "TypeScript-Typen sind aktuell (sonst: cd web && npm run gen:types)"
        run: |
          supabase gen types typescript --schema public > web/lib/supabase/database.types.ts
          git diff --exit-code web/lib/supabase/database.types.ts
      - run: supabase db lint -s public,private --level warning --fail-on warning

  # Edge Functions (ADR 011): Typcheck, Lint und Tests mit gefrorenem Lockfile (deno.json: lock.frozen).
  # Deno aus dem offiziellen Image, per Digest gepinnt; Version wie die lokale Edge Runtime (Deno 2).
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: process-listing-photo
        run: |
          docker run --rm -v "$PWD/supabase/functions:/fn" -w /fn/process-listing-photo \
            denoland/deno:2.1.4@sha256:3bf75873714baa410dcf7fabaf76d806d20f0ac8a7579df11577b4ed97416e34 \
            sh -c "deno task check && deno lint && deno task test"
      # Chat-Benachrichtigung (ADR 017, ADR 018): Mailtexte und Abbestell-Link. Ganzes supabase/ eingebunden, weil
      # die Tests die gemeinsamen Fixtures aus supabase/tests/fixtures lesen.
      - name: send-chat-notifications
        run: |
          docker run --rm -v "$PWD/supabase:/sb" -w /sb/functions/send-chat-notifications \
            denoland/deno:2.1.4@sha256:3bf75873714baa410dcf7fabaf76d806d20f0ac8a7579df11577b4ed97416e34 \
            sh -c "deno task check && deno lint && deno task test"
      # Suchauftrags- und Moderations-Mails (ADR 018) samt gemeinsamem Mailer (_shared/mail: SMTP-Aufbau,
      # Zusatz-Header, SITE_URL, Token); Fixtures mail_links/mail_labels/price_format gegen das Web.
      - name: send-search-notifications und _shared/mail
        run: |
          docker run --rm -v "$PWD/supabase:/sb" -w /sb/functions/send-search-notifications \
            denoland/deno:2.1.4@sha256:3bf75873714baa410dcf7fabaf76d806d20f0ac8a7579df11577b4ed97416e34 \
            sh -c "deno task check && deno lint && deno lint ../_shared/mail && deno task test"
      # Account-Löschung (ADR 019): Reihenfolge der Schritte, Wiederholung, Secret und Zeitbudget mit Mocks.
      - name: delete-account
        run: |
          docker run --rm -v "$PWD/supabase:/sb" -w /sb/functions/delete-account \
            denoland/deno:2.1.4@sha256:3bf75873714baa410dcf7fabaf76d806d20f0ac8a7579df11577b4ed97416e34 \
            sh -c "deno task check && deno lint && deno task test"
      # Storage-Aufräumen (ADR 019): Seiten, Zähler, Secret und Fehler mit Mocks.
      - name: account-maintenance
        run: |
          docker run --rm -v "$PWD/supabase:/sb" -w /sb/functions/account-maintenance \
            denoland/deno:2.1.4@sha256:3bf75873714baa410dcf7fabaf76d806d20f0ac8a7579df11577b4ed97416e34 \
            sh -c "deno task check && deno lint && deno task test"
      # Verifizierungsdokument (ADR 020, QA M9b F6): Rechte über die RPC, erste Bytes, Header mit Mocks.
      - name: verification-document
        run: |
          docker run --rm -v "$PWD/supabase:/sb" -w /sb/functions/verification-document \
            denoland/deno:2.1.4@sha256:3bf75873714baa410dcf7fabaf76d806d20f0ac8a7579df11577b4ed97416e34 \
            sh -c "deno task check && deno lint && deno task test"
